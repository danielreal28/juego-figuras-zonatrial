<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zonatrial Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen" class="menu-container">
        <h1 class="game-title">ZONATRIAL MEMORY</h1>
        
        <div class="history-box">
            <h3>📊 HISTORIAL DE JUEGO</h3>
            <p>Récord Mundial: <span id="menu-global-high">2000</span> pts</p>
            <p>Tu Récord Acumulado: <span id="menu-personal-high">0</span> pts</p>
        </div>

        <div class="menu-buttons">
            <button id="btn-continue" class="menu-btn continue">CONTINUAR PARTIDA</button>
            <button id="btn-new-game" class="menu-btn new-game">NUEVO JUEGO</button>
        </div>
        
        <div class="watermark-menu">Zonatrial App © DanielReal</div>
    </div>

    <div id="main-game-container" class="game-container hidden">
        
        <div class="header-stats">
            <div>Score: <span id="score">0</span></div>
            <div>Vidas: <span id="lives">7</span></div>
            <div>Poderes: <span id="power-count">3</span></div>
        </div>

        <div id="difficulty-alert">Nivel Inicial: 3s de memoria</div>

        <div class="records-bar">
            <div>🏆 Récord: <span id="global-high">2000</span></div>
            <div>👤 Tu Record: <span id="personal-high">0</span></div>
        </div>

        <div id="game-board" class="board"></div>

        <div class="action-buttons">
            <button id="btn-power" class="game-btn power">👁️ Revelar</button>
            <button id="btn-shuffle" class="game-btn shuffle">🔀 Mezclar</button>
            <button id="btn-hint" class="game-btn hint">💡 Pista</button>
        </div>

        <div class="watermark">Zonatrial App © DanielReal</div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="end-box">
            <h2 id="end-title">GAME OVER 💀</h2>
            <p id="end-message">Perdiste esta ronda.</p>
            <button id="btn-restart" class="restart-btn">Volver al Menú</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
